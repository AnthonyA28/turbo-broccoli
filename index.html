<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grovelink</title>

<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/datatable-min.2.2.2.css">

<script src="includes/plotly.jsv1.58.5.js"></script>

    <!-- <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/styles/ag-grid.css"> -->
    <!-- <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/styles/ag-theme-alpine.css"> -->
    <script src="https://unpkg.com/ag-grid-community/dist/ag-grid-community.min.js"></script>

</head>



<body>

<div class="container" id="container_port" style="max-width: 250px;">
    <form id="serialPortForm">
        <div id="hiddenSection">
            <label for="path">Path:</label>
            <select id="portSelect">
                <option value="">Select a port...</option>
            </select>
            <button type="button" id="refreshPorts">Refresh</button>
            <br><br>
            
            <label for="baudRate">Baud Rate:</label>
            <input type="number" id="baudRate" name="baudRate" value="9600" required>
            <br><br>
            
            <label for="dataBits">Data Bits:</label>
            <select id="dataBits" name="dataBits" required>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8" selected>8</option>
            </select>
            <br><br>
            
            <label for="stopBits">Stop Bits:</label>
            <select id="stopBits" name="stopBits" required>
                <option value="0" selected>1</option>
                <option value="1">2</option>
            </select>
            <br><br>

            <label for="startBits">Start Bits:</label>
            <select id="startBits" name="startBits" required>
                <option value="0" selected>1</option>
                <option value="1">2</option>
            </select>
            <br><br>
            
            <label for="parity">Parity:</label>
            <select id="parity" name="parity" required>
                <option value="none" selected>None</option>
                <option value="even">Even</option>
                <option value="mark">Mark</option>
                <option value="odd">Odd</option>
                <option value="space">Space</option>
            </select>
            <br><br>
            
            <label for="flowControl">Flow Control:</label>
            <select id="flowControl" name="flowControl" required>
                <option value="false" selected>false</option>
                <option value="true">true</option>
            </select>
            <br><br>
            <!-- <div style="display: flex; align-items: center; gap: 10px;"> -->
                <!-- <br> -->
                <label for="delimiter">Delimiter:</label>
                <input type="text" id="delimiter" name="delimiter" value="\n" style="flex: 1;">
            <!-- </div> -->
            <br><br>
            <div style="display: flex; align-items: center;">
                

                <!-- <button type="button" id="chooseFolderButton" onclick="chooseFolder()" style="margin-right: 10px;">
                    Choose Log Folder
                </button> -->
                <!-- <div style="display: flex; align-items: center;"> -->
                    <label style="margin-right: 20px;">
                        <input type="checkbox" id="logDataCheckbox" onchange="chooseFolder()" style="margin-right: 10px;">
                        Log Data
                    </label>
                    <br>
                    <!-- <p style="margin: 0; margin-right: 10px;">Name:</p> -->
                    <input type="text" id="fileName" style="flex: 1;" disabled>
                <!-- </div> -->
            </div>
            <br>
        </div>
        
        <button type="button" id="connectButton" onclick="connectDisconnect()">Connect</button>
    </form>
</div>
    <div class="container" id="container_commands" style="max-width: 250px;">
        <label for="commandInput">Command:</label>
        <input type="text" id="commandInput" placeholder="Command">
        
        <div style="display: flex; gap: 10px;">
            <button id="addCommandBtn">Add Command</button>
            <button id="submitCommandBtn">Submit Command</button>
        </div>

        <ol id="stringList">
        </ol>
    </div>

    <div class="container" id="container_graph"
>        <div id="plotlyGraph" style="width: 100%; height: 100%"></div>
    </div>

    <div class="container"  id="container3" style="display: none;">
        <textarea id="outputText" placeholder="" readonly></textarea>
        <div style="display: flex; align-items: center; gap: 0px;">
            <input type="text" id="messageInput" placeholder="Enter message" style="flex: 1;">
            <button id="sendButton">Send</button>
        </div>

    </div>

    <div class="container" id="container_table">
        <div id="myGrid" class="ag-theme-alpine" style="height: 1200px; width: 100%;"></div>
    </div>

</body>

<script src="indexjs/array.js"></script>
<script src="index.js"></script>
<script src="indexjs/plot.js"></script>
<script src="indexjs/UI.js"></script>
<script src="indexjs/table.js"></script>
<script src="indexjs/commands.js"></script>
<script>
    

</script>

</html>
